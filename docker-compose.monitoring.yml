version: "3.9"

# ─────────────────────────────────────────────────────────────────
# MONITORING + LOGGING STACK (Bonus)
# Add to any environment:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml \
#                  -f docker-compose.monitoring.yml up
# Access:
#   Prometheus: http://localhost:9090
#   Loki:       http://localhost:3100   (internal log store)
#   Promtail:   http://localhost:9080   (log shipper health)
#   Grafana:    http://localhost:3000   (admin / admin)
#     → Add Loki data source: http://loki:3100
#     → Explore > Loki > {service="user-service"}
# ─────────────────────────────────────────────────────────────────

services:
  # ── Metrics ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - event-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - event-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/eventdb?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - event-network
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    networks:
      - event-network
    restart: unless-stopped

  # ── Centralized Logging (Loki Stack) ──────────────────────────────────────
  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.3
    ports:
      - "9080:9080"
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      # Docker socket — lets Promtail discover running containers and their labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Container log files — Promtail reads these directly
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - event-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana (unified metrics + logs dashboard) ─────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-provision Loki as a data source on first start
      GF_DATASOURCE_PROVISIONING: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    networks:
      - event-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
