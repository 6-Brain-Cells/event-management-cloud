groups:
  - name: service_health
    rules:
      - alert: ServiceDown
        expr: up{job=~"user-service|event-service|registration-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been unreachable for 1 minute."

      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{status=~"5..",job=~".*-service"}[5m])) by (job)
          /
          sum(rate(http_requests_total{job=~".*-service"}[5m])) by (job)
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} error rate is {{ $value | humanizePercentage }} over 5 minutes."

      - alert: HighResponseTime
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job=~".*-service"}[5m])) by (job, le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} p95 latency is {{ $value }}s."

  - name: infrastructure
    rules:
      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Active connections: {{ $value }} (threshold: 80)"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 90%"
          description: "Redis memory usage is {{ $value | humanizePercentage }}."

      - alert: RabbitMQQueueDepthHigh
        expr: rabbitmq_queue_messages{queue="notification_queue"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ notification_queue has high message depth"
          description: "Queue depth is {{ $value }} messages."
