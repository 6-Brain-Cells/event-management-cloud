global:
  namespace: default
  imagePullPolicy: Never

  config:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: eventdb
    DB_USER: postgres
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USER: guest
    EVENT_SERVICE_URL: http://event-service:8000
    JWT_SECRET: event-mgmt-jwt-secret-2024
    SERVICE_API_KEY: svc-key-internal-2024
    CORS_ORIGINS: "http://localhost:8080,http://localhost:8081,http://localhost:8082"
    CACHE_TTL: "30"
    DB_POOL_MIN: "2"
    DB_POOL_MAX: "10"
    CB_FAILURE_THRESHOLD: "5"
    CB_RECOVERY_TIMEOUT: "30"
    CB_HALF_OPEN_MAX: "3"
    DLQ_MAX_RETRIES: "3"

  secrets:
    DB_PASSWORD: postgres
    RABBITMQ_PASSWORD: guest
    REDIS_PASSWORD: ""

infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  redis:
    enabled: true
    image: redis:7-alpine
    persistence:
      enabled: true
      size: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

services:
  user-service:
    replicas: 2
    image: event-mgmt/user-service:latest
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  event-service:
    replicas: 2
    image: event-mgmt/event-service:latest
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  registration-service:
    replicas: 2
    image: event-mgmt/registration-service:latest
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  notification-service:
    replicas: 1
    image: event-mgmt/notification-service:latest
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

nginx:
  replicas: 1
  image: event-mgmt/nginx:latest
  port: 80
  nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
