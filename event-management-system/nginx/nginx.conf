events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_method [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream service pools
    upstream user_service {
        server user-service:8000;
    }
    upstream event_service {
        server event-service:8000;
    }
    upstream registration_service {
        server registration-service:8000;
    }
    upstream notification_service {
        server notification-service:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check
        location /health {
            return 200 '{"status":"gateway-healthy"}';
            add_header Content-Type application/json;
        }

        # Route to User Service
        location /api/users {
            proxy_pass http://user_service/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route to Event Service
        location /api/events {
            proxy_pass http://event_service/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route to Registration Service
        location /api/registrations {
            proxy_pass http://registration_service/registrations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route to Notification Service
        location /api/notifications {
            proxy_pass http://notification_service/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serve frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
