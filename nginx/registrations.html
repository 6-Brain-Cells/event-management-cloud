<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub – My Tickets</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="main">
    <h1 class="page-title">My Tickets</h1>
    <p class="page-subtitle">View and manage your event registrations</p>

    <section class="card">
      <div class="card-header">
        <h2>Registrations</h2>
        <button id="refresh-regs" class="secondary" style="margin:0;">Refresh</button>
      </div>
      <div id="regs-grid" class="grid-container">
        <div class="empty-state"><span class="empty-state-icon">⏳</span><span class="empty-state-text">Loading your tickets...</span></div>
      </div>
    </section>
  </main>

  <footer>© 2026 EventHub — Cloud-Native Event Management Platform</footer>

  <script type="module">
    import { apiCall, renderNavbar, getActiveUserId, formatCurrency, formatRelativeTime, showToast } from './assets/api.js';
    renderNavbar('registrations');

    const regsGrid = document.getElementById('regs-grid');
    const refreshBtn = document.getElementById('refresh-regs');

    async function loadRegistrations() {
      const userId = getActiveUserId();
      if (!userId) {
        regsGrid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">👤</span><span class="empty-state-text">Please select an Active User profile from the navigation bar.</span></div>';
        return;
      }

      try {
        const [regsData, eventsData] = await Promise.all([
          apiCall(`/api/registrations/user/${userId}`),
          apiCall('/api/events').catch(() => ({ events: [] }))
        ]);

        const regs = regsData.registrations || [];
        const eventsMap = {};
        (eventsData.events || []).forEach(e => { eventsMap[e.id] = e; });

        regsGrid.innerHTML = '';

        if (regs.length === 0) {
          regsGrid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">🎟️</span><span class="empty-state-text">You have no tickets yet. Browse events to register!</span></div>';
          return;
        }

        regs.forEach(r => {
          const ev = eventsMap[r.event_id] || {};
          let statusBadge = 'neutral';
          let statusLabel = r.status;
          if (r.status === 'confirmed') { statusBadge = 'success'; statusLabel = 'Confirmed'; }
          if (r.status === 'pending') { statusBadge = 'warning'; statusLabel = 'Pending'; }
          if (r.status === 'cancelled') { statusBadge = 'danger'; statusLabel = 'Cancelled'; }

          let payBadge = 'neutral';
          let payLabel = r.payment_status || 'N/A';
          if (r.payment_status === 'completed') { payBadge = 'success'; payLabel = 'Paid'; }
          if (r.payment_status === 'pending') { payBadge = 'warning'; payLabel = 'Pending'; }
          if (r.payment_status === 'failed') { payBadge = 'danger'; payLabel = 'Failed'; }

          const card = document.createElement('div');
          card.className = 'ticket-card';
          card.innerHTML = `
            <div class="ticket-header">
              <div style="display:flex;gap:0.4rem;align-items:center;">
                <span class="badge ${statusBadge}">${statusLabel}</span>
                ${ev.title ? '' : `<span class="badge neutral">Event #${r.event_id}</span>`}
              </div>
              <span class="badge neutral" style="font-family:monospace;">Ticket #${r.id}</span>
            </div>
            <div class="ticket-body">
              ${ev.title ? `<h3 style="font-size:1rem;font-weight:700;color:#fff;margin:0;">${ev.title}</h3>` : ''}
              ${ev.description ? `<p style="font-size:0.82rem;color:var(--text-secondary);margin:0;line-height:1.4;">${ev.description.slice(0, 120)}${ev.description.length > 120 ? '...' : ''}</p>` : ''}
              <div class="ticket-meta">
                ${ev.location ? `<span class="ticket-meta-item">📍 ${ev.location}</span>` : ''}
                ${ev.start_date ? `<span class="ticket-meta-item">📅 ${new Date(ev.start_date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>` : ''}
                <span class="ticket-meta-item">🕐 ${formatRelativeTime(r.registration_date)}</span>
                ${r.ticket_number ? `<span class="ticket-meta-item">🎫 ${r.ticket_number}</span>` : ''}
              </div>
              <div style="display:flex;gap:0.4rem;align-items:center;margin-top:0.25rem;">
                <span class="badge ${payBadge}">Payment: ${payLabel}</span>
                ${r.payment_method && r.payment_method !== 'free' ? `<span class="badge neutral">${r.payment_method}</span>` : ''}
              </div>
              ${r.status !== 'cancelled' && r.payment_status === 'pending' && ev.ticket_price > 0 ? `
                <div class="ticket-actions">
                  <button class="btn" style="font-size:0.8rem;padding:0.4rem 0.8rem;" onclick="processPayment(${r.id}, ${ev.ticket_price})">
                    Process Payment (${formatCurrency(ev.ticket_price)})
                  </button>
                </div>
              ` : ''}
            </div>
          `;
          regsGrid.appendChild(card);
        });

      } catch (err) {
        regsGrid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">⚠️</span><span class="empty-state-text">Error loading tickets</span></div>';
        showToast(err.message, 'error');
      }
    }

    window.processPayment = async function(regId, amount) {
      try {
        await apiCall(`/api/registrations/${regId}/process-payment`, 'POST', {
          payment_method: 'credit_card',
          amount: amount
        });
        showToast('Payment processed successfully!', 'success');
        loadRegistrations();
      } catch (err) {
        showToast('Payment failed: ' + err.message, 'error');
      }
    };

    refreshBtn.addEventListener('click', loadRegistrations);
    setTimeout(loadRegistrations, 100);
  </script>
</body>
</html>
