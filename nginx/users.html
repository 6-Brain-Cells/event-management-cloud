<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub – Users</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="main">
    <h1 class="page-title">Users</h1>
    <p class="page-subtitle">Manage user accounts and profiles</p>

    <div class="section-grid">
      <section class="card">
        <div class="card-header">
          <h2>Register New User</h2>
        </div>
        <form id="register-form" class="form-grid">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="johndoe">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
          </div>
          <div class="form-actions">
            <div id="register-status" class="status-message"></div>
            <button type="submit">Create Account</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>All Users</h2>
          <button id="refresh-users" class="secondary" style="margin:0;">Refresh</button>
        </div>
        <div id="users-grid" class="grid-container">
          <div class="empty-state"><span class="empty-state-icon">⏳</span><span class="empty-state-text">Loading users...</span></div>
        </div>
      </section>
    </div>
  </main>

  <footer>© 2026 EventHub — Cloud-Native Event Management Platform</footer>

  <script type="module">
    import { apiCall, renderNavbar, getInitials, getAvatarColor, showToast } from './assets/api.js';
    renderNavbar('users');

    const registerForm = document.getElementById('register-form');
    const registerStatus = document.getElementById('register-status');
    const usersGrid = document.getElementById('users-grid');
    const refreshBtn = document.getElementById('refresh-users');

    async function loadUsers() {
      try {
        const data = await apiCall('/api/users');
        const users = data.users || [];
        usersGrid.innerHTML = '';

        if (users.length === 0) {
          usersGrid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">👤</span><span class="empty-state-text">No users yet. Create one above!</span></div>';
          return;
        }

        users.forEach(user => {
          const card = document.createElement('div');
          card.className = 'data-card';
          card.style.flexDirection = 'row';
          card.style.alignItems = 'center';
          card.style.gap = '1rem';
          card.innerHTML = `
            <div class="avatar ${getAvatarColor(user.id)}">${getInitials(user.full_name)}</div>
            <div style="flex:1;min-width:0;">
              <h3 style="margin-bottom:0.1rem;">${user.full_name}</h3>
              <p style="font-size:0.85rem;color:var(--text-secondary);margin:0;">@${user.username}</p>
              <p style="font-size:0.8rem;color:var(--muted);margin:0;">${user.email}</p>
            </div>
            <span class="badge neutral">#${user.id}</span>
          `;
          usersGrid.appendChild(card);
        });
      } catch (err) {
        usersGrid.innerHTML = '<div class="empty-state"><span class="empty-state-icon">⚠️</span><span class="empty-state-text">Error loading users</span></div>';
        showToast(err.message, 'error');
      }
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerStatus.textContent = '';
      const btn = registerForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating...';

      const formData = new FormData(registerForm);
      const data = Object.fromEntries(formData.entries());

      try {
        await apiCall('/api/users/register', 'POST', data);
        showToast('Account created successfully!', 'success');
        registerForm.reset();
        loadUsers();
        setTimeout(() => window.location.reload(), 1500);
      } catch (err) {
        registerStatus.textContent = err.message;
        registerStatus.style.color = 'var(--danger)';
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    refreshBtn.addEventListener('click', loadUsers);
    loadUsers();
  </script>
</body>
</html>
