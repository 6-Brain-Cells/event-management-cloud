<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub – Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="main">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Your event management command center</p>

    <div id="stats-grid" class="stats-grid"></div>

    <div class="section-grid">
      <section class="card">
        <div class="card-header">
          <h2>Quick Actions</h2>
        </div>
        <div id="quick-actions" class="quick-links"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Recent Events</h2>
          <a href="/events.html" class="btn secondary" style="padding:0.4rem 0.8rem;font-size:0.8rem;">View All</a>
        </div>
        <div id="recent-events" class="grid-container">
          <div class="empty-state"><span class="empty-state-icon">⏳</span><span class="empty-state-text">Loading events...</span></div>
        </div>
      </section>
    </div>
  </main>

  <footer>© 2026 EventHub — Cloud-Native Event Management Platform</footer>

  <script type="module">
    import { apiCall, renderNavbar, requireAuth, getUserId, getUserRole, isSuperAdmin, isOrganizer, getEventTypeIcon, formatCurrency, showToast } from './assets/api.js';

    if (!requireAuth()) throw new Error('Auth required');
    renderNavbar('home');

    const statsGrid = document.getElementById('stats-grid');
    const recentEvents = document.getElementById('recent-events');
    const quickActions = document.getElementById('quick-actions');
    const role = getUserRole();

    function renderQuickActions() {
      const actions = [
        { href: '/events.html', icon: '📅', iconClass: 'purple', title: 'Browse Events', desc: 'Discover and register for events' },
      ];

      if (isOrganizer()) {
        actions.push({ href: '/events.html#create', icon: '➕', iconClass: 'green', title: 'Host an Event', desc: 'Create and publish a new event' });
      }

      actions.push({ href: '/registrations.html', icon: '🎟️', iconClass: 'blue', title: 'My Tickets', desc: 'View and manage your registrations' });
      actions.push({ href: '/notifications.html', icon: '🔔', iconClass: 'yellow', title: 'Notifications', desc: 'Check your alerts and updates' });

      if (isSuperAdmin()) {
        actions.push({ href: '/users.html', icon: '👥', iconClass: 'red', title: 'Manage Users', desc: 'Administer user accounts and roles' });
      }

      quickActions.innerHTML = actions.map(a => `
        <a href="${a.href}" class="quick-link">
          <div class="quick-link-icon ${a.iconClass}">${a.icon}</div>
          <div class="quick-link-text">
            <h3>${a.title}</h3>
            <p>${a.desc}</p>
          </div>
        </a>
      `).join('');
    }

    async function loadDashboard() {
      try {
        const userId = getUserId();
        const [eventsData, regsData, notifsData] = await Promise.all([
          apiCall('/api/events').catch(() => ({ events: [] })),
          userId ? apiCall(`/api/registrations/user/${userId}`).catch(() => ({ registrations: [] })) : Promise.resolve({ registrations: [] }),
          userId ? apiCall(`/api/notifications/user/${userId}?unread_only=true`).catch(() => ({ notifications: [] })) : Promise.resolve({ notifications: [] }),
        ]);

        const events = eventsData.events || [];
        const regs = regsData.registrations || [];
        const unreadNotifs = (notifsData.notifications || []).length;
        const upcomingCount = events.filter(e => new Date(e.start_date) > new Date()).length;

        statsGrid.innerHTML = `
          <div class="stat-card">
            <div class="stat-icon purple">📅</div>
            <div class="stat-content">
              <div class="stat-value">${events.length}</div>
              <div class="stat-label">Total Events</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">🗓️</div>
            <div class="stat-content">
              <div class="stat-value">${upcomingCount}</div>
              <div class="stat-label">Upcoming</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">🎟️</div>
            <div class="stat-content">
              <div class="stat-value">${regs.length}</div>
              <div class="stat-label">My Tickets</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon yellow">🔔</div>
            <div class="stat-content">
              <div class="stat-value">${unreadNotifs}</div>
              <div class="stat-label">Unread Alerts</div>
            </div>
          </div>
        `;

        recentEvents.innerHTML = '';
        if (events.length === 0) {
          recentEvents.innerHTML = '<div class="empty-state"><span class="empty-state-icon">📭</span><span class="empty-state-text">No events yet. Be the first to host one!</span></div>';
          return;
        }

        events.slice(0, 6).forEach(event => {
          const card = document.createElement('div');
          card.className = 'data-card';
          const startDate = new Date(event.start_date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
          const startTime = new Date(event.start_date).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

          card.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="badge primary">${event.event_type}</span>
              <span class="badge neutral">${formatCurrency(event.ticket_price)}</span>
            </div>
            <h3>${event.title}</h3>
            <p style="font-size:0.82rem;color:var(--text-secondary);line-height:1.4;flex:1;">${event.description || 'No description provided'}</p>
            <div style="display:flex;gap:0.75rem;font-size:0.78rem;color:var(--muted);flex-wrap:wrap;">
              <span>📍 ${event.location || 'TBA'}</span>
              <span>📅 ${startDate}</span>
              <span>🕐 ${startTime}</span>
            </div>
            <div class="card-actions">
              <a href="/events.html" class="btn secondary" style="font-size:0.75rem;padding:0.3rem 0.6rem;text-decoration:none;">View Details</a>
            </div>
          `;
          recentEvents.appendChild(card);
        });
      } catch (err) {
        showToast('Failed to load dashboard data', 'error');
      }
    }

    renderQuickActions();
    loadDashboard();
  </script>
</body>
</html>
