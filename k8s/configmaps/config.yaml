apiVersion: v1
kind: ConfigMap
metadata:
  name: event-mgmt-config
  namespace: default
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "eventdb"
  DB_USER: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  EVENT_SERVICE_URL: "http://event-service:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: event-mgmt-secrets
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  REDIS_PASSWORD: ""
  RABBITMQ_PASSWORD: "guest"
