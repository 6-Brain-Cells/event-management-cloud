apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-management
  namespace: argocd
  labels:
    app.kubernetes.io/name: event-management
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: devops-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/6-Brain-Cells/event-management-cloud
    targetRevision: HEAD
    path: helm/event-management
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
